<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &amp; Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- ===== BRAND PANEL ===== -->
    <aside class="panel brand-panel">
      <div class="brand-inner">
        <p class="brand-mark">Northbound<span>.</span></p>
        <h1>Pick up right where you left off.</h1>
        <p class="brand-copy">One account for everything — your notes, your tasks, your projects, all in one place.</p>
        <ul class="brand-points">
          <li>Free forever for personal use</li>
          <li>Your data stays yours</li>
          <li>No spam, ever</li>
        </ul>
      </div>
    </aside>

    <!-- ===== FORM PANEL ===== -->
    <main class="panel form-panel">
      <div class="form-shell">

        <!-- Tabs -->
        <div class="tabs" role="tablist">
          <button class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form">Log in</button>
          <button class="tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="signup-form">Sign up</button>
          <span class="tab-indicator"></span>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form" novalidate>
          <p class="form-status" id="login-status" role="alert"></p>

          <div class="field">
            <label for="login-email">Email</label>
            <input type="text" id="login-email" name="email" placeholder="you@example.com" autocomplete="email">
            <span class="error" id="login-email-error"></span>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-visibility" data-target="login-password">Show</button>
            </div>
            <span class="error" id="login-password-error"></span>
          </div>

          <div class="field-row">
            <label class="checkbox">
              <input type="checkbox" id="remember-me"> Remember me
            </label>
            <a href="#" class="link-muted">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit">Log in</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signup-form" class="auth-form hidden" novalidate>
          <p class="form-status" id="signup-status" role="alert"></p>

          <div class="field">
            <label for="signup-name">Full name</label>
            <input type="text" id="signup-name" name="name" placeholder="Jordan Rivera" autocomplete="name">
            <span class="error" id="signup-name-error"></span>
          </div>

          <div class="field">
            <label for="signup-email">Email</label>
            <input type="text" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email">
            <span class="error" id="signup-email-error"></span>
          </div>

          <div class="field">
            <label for="signup-phone">Phone number</label>
            <input type="text" id="signup-phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel">
            <span class="error" id="signup-phone-error"></span>
          </div>

          <div class="field">
            <label for="signup-password">Password</label>
            <div class="password-wrap">
              <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
              <button type="button" class="toggle-visibility" data-target="signup-password">Show</button>
            </div>
            <div class="strength-meter" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <span class="error" id="signup-password-error"></span>
          </div>

          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <input type="password" id="signup-confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password">
            <span class="error" id="signup-confirm-error"></span>
          </div>

          <label class="checkbox terms">
            <input type="checkbox" id="agree-terms">
            I agree to the Terms of Service and Privacy Policy
          </label>
          <span class="error" id="terms-error"></span>

          <button type="submit" class="btn-submit">Create account</button>
        </form>

      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
